<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./icons/dn-favicon-64.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#E9ECDA">
    <link rel="apple-touch-icon" href="./icons/dn-apple-touch-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Hiking Book">
    <title>Hiking Book</title>
</head>
<body>
    <header class="site-bar">
        <a class="home" href="./index.html">Hiking Book</a>
        <button class="pill install-button" id="install" type="button" hidden>Install</button>
    </header>
    <p class="install-hint" id="install-hint" hidden>
        On iPhone or iPad: tap the Share button, then <strong>Add to Home Screen</strong>.
    </p>

    <main class="directory sheet">
        <section class="intro">
            <h1>Our hikes</h1>
            <p class="lead" id="totals"></p>
        </section>

        <section class="finder" aria-label="Find hikes near a place">
            <form class="place-search" id="place-search" role="search">
                <svg class="place-search-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
                <input type="search" id="place-input" name="place" placeholder="Near a place, e.g. Garmisch" autocomplete="off" enterkeyhint="search" aria-label="Place">
                <button class="pill" type="submit">Search</button>
            </form>
            <p class="place-status" id="place-status" aria-live="polite" hidden></p>
            <div class="overview-map" id="overview-map"></div>
            <p class="you-status" id="you-status" aria-live="polite" hidden></p>
        </section>

        <div class="hike-list" id="hike-list"></div>
    </main>

    <script type="module" src="/src/directory.js"></script>
</body>
</html>

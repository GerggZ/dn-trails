<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/png" href="./icons/dn-favicon-64.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#E9ECDA">
    <link rel="apple-touch-icon" href="./icons/dn-apple-touch-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Hiking Book">
    <!-- iPhone app: the page runs up behind the clock / battery strip (see .site-bar padding) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Hike</title>
  <script type="module" crossorigin src="./assets/hike-CFBzHcDh.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/full-screen-O1jh5bgm.js">
  <link rel="stylesheet" crossorigin href="./assets/full-screen-Bpx9nUNH.css">
  <link rel="stylesheet" crossorigin href="./assets/hike-BIYv832H.css">
</head>
<body>
    <header class="site-bar">
        <a class="home" href="./index.html">Hiking Book</a>
        <a class="back" href="./index.html">All hikes</a>
    </header>

    <div class="sheet">
    <section class="hero" id="hero"></section>

    <main class="page">
        <header class="title-block">
            <h1 id="title">Loading…</h1>
            <p class="subtitle" id="subtitle"></p>
        </header>

        <dl class="stats" id="stats"></dl>

        <div class="description" id="description" hidden></div>

        <section class="terrain" aria-label="Map and elevation profile">
            <div id="map-container"></div>
            <p class="you-status" id="you-status" role="status" hidden></p>
            <div id="elevation-container"></div>
            <div class="offline-row">
                <button class="pill" id="save-offline" type="button" hidden>Save for offline</button>
                <span class="offline-status" id="offline-status" role="status"></span>
            </div>
        </section>

        <section class="photos" id="photo-container" hidden>
            <h2>Photos</h2>
            <div class="photo-grid" id="photo-grid"></div>
        </section>
    </main>
    </div>

    <div id="tooltip" role="status"></div>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
        <button class="lightbox-close" type="button" aria-label="Close">&times;</button>
        <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous photo">&#10094;</button>
        <button class="lightbox-nav lightbox-next" type="button" aria-label="Next photo">&#10095;</button>
        <figure>
            <img class="lightbox-content" id="lightbox-img" alt="">
            <figcaption id="lightbox-caption" class="lightbox-caption"></figcaption>
        </figure>
    </div>

</body>
</html>
